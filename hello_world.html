<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090d1a" />
  <title>Hello, World!</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: #f7f8ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 18% 20%, rgba(112, 76, 255, .28), transparent 38%),
        radial-gradient(ellipse at 82% 78%, rgba(0, 214, 201, .18), transparent 36%),
        #090d1a;
    }
    .orb {
      position: fixed;
      width: 340px; height: 340px;
      border-radius: 50%;
      filter: blur(75px);
      opacity: .28;
      pointer-events: none;
      animation: float 9s ease-in-out infinite alternate;
    }
    .orb.one { background: #7857ff; top: -130px; left: -100px; }
    .orb.two { background: #00cdbb; bottom: -150px; right: -90px; animation-delay: -4s; }
    main {
      position: relative;
      width: min( min(680px, calc(100% - 36px)), 680px);
      padding: 64px 42px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      box-shadow: 0 30px 100px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.12);
      backdrop-filter: blur(18px);
      animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      margin-bottom: 25px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      color: #c7c9dc;
      background: rgba(255,255,255,.055);
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #54e6bd; box-shadow: 0 0 12px #54e6bd; }
    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 10vw, 6.4rem);
      line-height: 1.02;
      letter-spacing: -.075em;
      font-weight: 800;
      background: linear-gradient(100deg, #fff 15%, #c7baff 53%, #83f1e4 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p { margin: 22px 0 0; color: #aeb4ca; font-size: clamp(1rem, 2.5vw, 1.12rem); line-height: 1.7; }
    .spark { display: inline-block; color: #ffe28a; animation: twinkle 2s ease-in-out infinite; }
    .footer { margin-top: 38px; color: #777f99; font-size: .78rem; letter-spacing: .08em; }
    @keyframes rise { from { opacity: 0; transform: translateY(22px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes float { to { transform: translate(45px, 35px) scale(1.12); } }
    @keyframes twinkle { 50% { transform: rotate(18deg) scale(1.2); opacity: .7; } }
    @media (max-width: 520px) { main { padding: 48px 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>
  <main>
    <div class="tag"><span class="dot"></span> Your first web page</div>
    <h1>Hello,<br />World!</h1>
    <p>A little bit of HTML, a touch of CSS,<br />and a whole lot of possibility.</p>
    <div class="footer">MADE WITH <span class="spark">✦</span> AND A FEW LINES OF CODE</div>
  </main>
</body>
</html>
